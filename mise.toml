# mise configuration for Sidepiece
# https://mise.jdx.dev/configuration.html

[tools]
node = "lts"
pnpm = "11.5.0"

[env]
_.path = [".mise/scripts", "agents/hermes/pm"]
_.file = [".env"]

# This block will handle the linking of
# agent files to the main AGENTS.md file.
#
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
[[hooks.enter]]
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"
[[hooks.enter]]
run = "'{{config_root}}/.mise/scripts/materialize-env.sh'"

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link:agentfiles"

[tasks."link:agentfiles"]
description = "Symlink all agent files to AGENTS.md"
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"

[tasks."skills:sync"]
description = "Reconcile this project's selected skills"
tools = { "npm:@delorenj/skillex" = { version = "0.1.1", allow_low_downloads = true }, node = "24" }
run = "skillex sync --scope project --project '{{config_root}}'"

# >>> mise-versioning >>>  (managed block — do not edit by hand; re-run init to update)
[tasks."version"]
description = "Print the current version (vX.Y.Z)"
run = "{{config_root}}/.mise/scripts/versioning.sh current"

[tasks."version:bump"]
description = "Bump patch version: vX.Y.Z -> vX.Y.(Z+1)"
alias = "version:bump-patch"
run = "{{config_root}}/.mise/scripts/versioning.sh bump patch"

[tasks."version:bump-minor"]
description = "Bump minor version: vX.Y.Z -> vX.(Y+1).0"
run = "{{config_root}}/.mise/scripts/versioning.sh bump minor"

[tasks."version:bump-major"]
description = "Bump major version: vX.Y.Z -> v(X+1).0.0"
run = "{{config_root}}/.mise/scripts/versioning.sh bump major"

[tasks."version:check"]
description = "Verify every versioned file is in parity"
run = "{{config_root}}/.mise/scripts/versioning.sh check"

[tasks."version:sync"]
description = "Force every versioned file up to the highest version"
run = "{{config_root}}/.mise/scripts/versioning.sh sync"
# <<< mise-versioning <<<

[tasks.typecheck]
description = "tsc --noEmit over every workspace package"
run = "pnpm -r run typecheck"

[tasks.lint]
description = "Biome lint + format check (packages/** and root config) + SQL no-project-id grep"
run = "sh lint/lint.sh"

[tasks."lint:selftest"]
description = "Self-test the no-project-id lint (A-P1) against temp fixtures"
run = "sh lint/no-project-id.test.sh"

[tasks.format]
description = "Apply Biome formatting and safe fixes"
run = "pnpm exec biome check --write ."

[tasks."deploy:selftest"]
description = "Self-test deploy-bridge.sh's refusal and no-touch paths with stub systemctl/loginctl/curl"
run = "bash .mise/scripts/deploy-bridge.test.sh"

[tasks.test]
description = "Run package tests where present"
depends = ["lint:selftest", "deploy:selftest"]
run = "pnpm -r --if-present run test"

[tasks.build]
description = "Build every workspace package"
depends = ["typecheck", "lint"]
run = "pnpm -r run build"

[tasks."build:bridge"]
description = "Bundle the Bridge to the single file packages/bridge/dist/bridge.mjs"
run = "pnpm --filter @sidepiece/bridge run build"

[tasks.deploy]
description = "Install the Bridge bundle + systemd --user unit on big-chungus, never touching the state dir"
depends = ["build:bridge"]
run = "bash .mise/scripts/deploy-bridge.sh"

[tasks."tailnet:check"]
description = "From a tailnet device: TLS without -k, the LNA preflight, and 50-request p50/p95 against the Bridge"
run = "sh .mise/scripts/tailnet-check.sh"

[tasks."loop:recover"]
description = "Recover bmad-loop from diverged baselines or paused manual-rollback states and restart"
run = "{{config_root}}/.mise/scripts/bmad-loop-recover.py"

